<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Feedback — EZEATS</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/feedback.css"></head><body><a class="skip-link" href="#main-content">Skip to content</a><main class="feedback-page" id="main-content" data-owner="false"><nav aria-label="Page navigation"><a href="/">EZEATS home</a> · <a href="/account/">Sign in</a></nav><h1>Your feedback</h1><p>Private conversations with the EZEATS team.</p><p id="feedback-status" class="feedback-status" role="status" aria-live="polite">Checking your account…</p><button id="retry">Refresh inbox</button><div id="inbox" hidden class="feedback-layout"><section class="feedback-list" aria-label="Conversations"><button id="new">New conversation</button><form id="filters" hidden><label>Category<select name="category"><option value="">All categories</option></select></label><label>Status<select name="status"><option value="">All statuses</option></select></label><label>Subject search<input name="search" maxlength="120"></label><label>Archived<select name="archived"><option value="false">Active</option><option value="true">Archived</option></select></label><button>Apply filters</button></form><div id="conversations"></div><button id="more" hidden>More conversations</button></section><section class="feedback-detail" aria-label="Selected conversation"><button class="feedback-back" id="back">Back to conversations</button><div id="detail"><p>Select a conversation or start a new one.</p></div></section></div></main><script type="module" src="/feedback.js"></script></body></html>
